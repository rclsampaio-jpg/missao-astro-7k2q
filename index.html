<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#4a2370">
<title>Missão Astro</title>
<style>
:root{--p:#4a2370;--p2:#6f3fa0;--p3:#b58fd6;--g:#c9a35b;--g2:#f2d58a;--bg:#f7f1fc;--ink:#2a2033;--mut:#7a6a88;--ok:#2f9e6e;--no:#d9432f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Trebuchet MS",-apple-system,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45}
body{min-height:100vh;background:radial-gradient(circle at 50% -10%,#efe2fb 0,#f7f1fc 45%,#f7f1fc 100%)}
#app{max-width:560px;margin:0 auto;padding:14px 16px 96px}
.glyph{font-family:"Apple Symbols","Menlo","Segoe UI Symbol",serif}
header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
.brand{font-family:Georgia,serif;font-size:20px;color:var(--p);letter-spacing:.02em}
.brand span{color:var(--g)}
.pts{background:#fff;border:2px solid var(--g2);color:var(--p);font-weight:700;border-radius:99px;padding:4px 12px;font-size:15px}
h1,h2,h3{font-family:Georgia,serif;font-weight:400;color:var(--p);margin:0}
h1{font-size:30px;line-height:1.12}
h2{font-size:23px;line-height:1.2}
p{margin:6px 0}
.hero{background:linear-gradient(145deg,var(--p) 0,var(--p2) 60%,#8a58c0 100%);color:#fff;border-radius:26px;padding:22px 20px;box-shadow:0 8px 24px rgba(74,35,112,.25);position:relative;overflow:hidden}
.hero h1{color:#fff}
.hero p{color:#ecdffb}
.hero .stars{position:absolute;right:14px;top:10px;color:var(--g2);letter-spacing:6px;font-size:14px;opacity:.9}
.bar{height:10px;background:rgba(255,255,255,.22);border-radius:99px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g));border-radius:99px;transition:width .5s}
.bar-l{font-size:13px;color:#e4d3f6;margin-top:6px}
.days{display:grid;gap:12px;margin-top:18px}
.day{display:flex;gap:14px;align-items:center;background:#fff;border-radius:22px;padding:14px 14px;box-shadow:0 2px 10px rgba(74,35,112,.10);border:2px solid transparent;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;transition:transform .12s}
.day:active{transform:scale(.985)}
.day .n{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;background:var(--c,var(--p2))}
.day b{display:block;font-family:Georgia,serif;font-size:19px;color:var(--p);font-weight:400}
.day small{color:var(--mut);font-size:14px}
.day .st{margin-left:auto;font-size:22px;color:#d9cce8}
.day.done{border-color:#bfe6d3}
.day.done .st{color:var(--ok)}
.tile{background:#fff;border-radius:22px;padding:16px;margin-top:16px;box-shadow:0 2px 10px rgba(74,35,112,.10)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--p);color:#fff;border:0;border-radius:16px;padding:14px 20px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 4px 0 #2f1550;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2f1550}
.btn.gold{background:var(--g);color:#2b1c05;box-shadow:0 4px 0 #8d6d2c}
.btn.gold:active{box-shadow:0 1px 0 #8d6d2c}
.btn.ghost{background:#fff;color:var(--p);box-shadow:0 0 0 2px var(--p3) inset;border:0}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.wide{width:100%}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.link{background:none;border:0;color:var(--p2);font:inherit;text-decoration:underline;cursor:pointer;padding:6px}
/* lesson */
.lt{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.x{background:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:20px;color:var(--p);box-shadow:0 1px 6px rgba(74,35,112,.15);cursor:pointer}
.dots{flex:1;display:flex;gap:5px}
.dots i{flex:1;height:8px;border-radius:99px;background:#e2d4f0}
.dots i.on{background:var(--g)}
.dots i.cur{background:var(--p2)}
.card{background:#fff;border-radius:26px;padding:22px 20px;box-shadow:0 6px 20px rgba(74,35,112,.13);animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card .big{font-size:56px;text-align:center;margin:4px 0 8px;color:var(--c,var(--p2))}
.card h2{text-align:center;margin-bottom:8px}
.card p{font-size:18px}
.tag{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--g);font-weight:700;margin-bottom:4px}
.trio{display:grid;gap:10px;margin:12px 0}
.trio div{border-radius:16px;padding:12px 14px;background:var(--b);border-left:6px solid var(--c);font-size:17px}
.trio b{font-family:Georgia,serif;font-size:22px;color:var(--c);margin-right:6px}
.flipgrid{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:12px}
.flipgrid.one{grid-template-columns:1fr}
.fl{perspective:700px;height:150px;cursor:pointer;border:0;background:none;padding:0;font:inherit;text-align:center}
.fl .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fl.on .in{transform:rotateY(180deg)}
.fl .f,.fl .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fl .f{background:var(--c,var(--p2));color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.fl .f .g{font-size:38px;line-height:1}
.fl .f b{font-family:Georgia,serif;font-weight:400;font-size:20px;margin-top:4px}
.fl .f small{opacity:.85;font-size:13px}
.fl .b{background:var(--b,#fff);color:var(--ink);transform:rotateY(180deg);border:3px solid var(--c);font-size:15px;line-height:1.3}
.fl .b em{font-style:normal;font-weight:700;color:var(--c);display:block;margin-top:6px;font-size:14px}
.hint{text-align:center;color:var(--mut);font-size:14px;margin-top:10px}
.q{font-size:20px;font-family:Georgia,serif;color:var(--p);margin:2px 0 14px;line-height:1.3}
.opts{display:grid;gap:10px}
.opt{background:#fff;border:2px solid #e2d4f0;border-radius:16px;padding:14px 16px;font:inherit;text-align:left;cursor:pointer;color:var(--ink);transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt.ok{background:#e1f5ec;border-color:var(--ok)}
.opt.no{background:#fde7e3;border-color:var(--no);animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.why{margin-top:12px;background:#fff8e6;border-left:5px solid var(--g);border-radius:12px;padding:10px 12px;font-size:16px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{background:#fff;border:2px solid #e2d4f0;border-radius:14px;padding:12px 10px;font:inherit;font-size:15px;cursor:pointer;min-height:58px;text-align:center;color:var(--ink)}
.mi.sel{border-color:var(--p2);background:#f1e8fb}
.mi.ok{background:#e1f5ec;border-color:var(--ok);pointer-events:none;opacity:.75}
.mi.no{animation:sh .35s;border-color:var(--no)}
.mi b{font-family:Georgia,serif;font-weight:400;font-size:17px;color:var(--p)}
.slot{margin:10px 0}
.slot label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #e2d4f0;background:#fff;border-radius:99px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.chip.sel{background:var(--p2);color:#fff;border-color:var(--p2)}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.no{background:var(--no);border-color:var(--no);color:#fff}
.scn{background:#f4ecfb;border-radius:16px;padding:12px 14px;font-size:17px;margin-bottom:6px}
.mission{background:linear-gradient(145deg,#fff6df,#fff);border:3px dashed var(--g);border-radius:26px;padding:22px 20px;text-align:center}
.mission .big{font-size:48px}
.check{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:14px;font-size:18px;cursor:pointer}
.check input{width:28px;height:28px;accent-color:var(--p2)}
.mine{background:linear-gradient(145deg,#efe6f7,#fff);border-radius:26px;padding:18px;border:2px solid var(--p3)}
.mine ul{margin:8px 0 0;padding:0;list-style:none}
.mine li{padding:9px 0;border-top:1px dashed #cdb8e4;font-size:16px}
.mine li:first-child{border-top:0}
.mine b{color:var(--p)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid #e6d9f0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.nav .btn{flex:1}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:in .3s}
.conf{position:fixed;top:-20px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
.tabs{display:flex;gap:8px;margin:12px 0 4px}
.tab{flex:1;background:#fff;border:2px solid #e2d4f0;border-radius:14px;padding:10px;font:inherit;font-weight:700;color:var(--p);cursor:pointer}
.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
.mp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mp div{background:#fff;border-radius:16px;padding:10px 12px;border-left:6px solid var(--c);box-shadow:0 2px 8px rgba(74,35,112,.08);font-size:14px}
.mp b{display:block;font-family:Georgia,serif;font-weight:400;font-size:17px;color:var(--p)}
.cert{background:linear-gradient(150deg,#fff8e6,#fff);border:4px double var(--g);border-radius:26px;padding:26px 18px;text-align:center}
.cert h1{margin:6px 0}

.inp{width:100%;padding:12px 14px;border:2px solid #e2d4f0;border-radius:14px;font:inherit;background:#fff;color:var(--ink)}
textarea.inp{min-height:96px;font-size:14px;word-break:break-all}
.score{display:flex;gap:10px;margin-bottom:12px}
.score div{flex:1;border-radius:16px;padding:8px 10px;background:#fff;text-align:center;border:3px solid transparent;font-weight:700;color:var(--mut)}
.score div.on{border-color:var(--g);background:#fff8e6;color:var(--p)}
.score b{display:block;font-size:26px;color:var(--p);font-family:Georgia,serif;font-weight:400}
.codebox{background:#f4ecfb;border:2px dashed var(--p3);border-radius:14px;padding:12px;font-family:Menlo,monospace;font-size:24px;text-align:center;letter-spacing:.25em;color:var(--p);margin:8px 0}
.cmp table{width:100%;border-collapse:collapse;margin-top:14px}
.cmp th,.cmp td{border-bottom:1px solid #e2d4f0;padding:8px;text-align:center}
.cmp .win{text-align:center;font-family:Georgia,serif;font-size:22px;color:var(--p);margin:12px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== dados do mapa da Sarah ===== */
var GL = {'Sol':'☉','Lua':'☽','Mercúrio':'☿','Vênus':'♀','Marte':'♂','Júpiter':'♃','Saturno':'♄','Urano':'♅','Netuno':'♆','Plutão':'♇'};
var COL = {'Sol':'#f2b705','Lua':'#7d8fd1','Mercúrio':'#2fa58f','Vênus':'#e0679b','Marte':'#d9432f','Júpiter':'#e08a1e','Saturno':'#6b5b7b','Urano':'#1aa3c4','Netuno':'#5b6ee1','Plutão':'#8e2f6b'};
var TXT = '︎';
function g(n){return (GL[n]||'✦')+TXT}
function mine(n){var m=MAPA[n];return m?('Seu '+n+': '+m[0]+', casa '+m[1]):''}
/* ===== mapas ===== */
var CHARTS={
 sarah:{name:'Sarah',other:'renata',nasc:'12/02/1988, 08h50, São Paulo',
  pl:{'Sol':['Aquário',11],'Lua':['Sagitário',9],'Mercúrio':['Aquário',11],'Vênus':['Áries',1],'Marte':['Sagitário',9],'Júpiter':['Áries',1],'Saturno':['Sagitário',9],'Urano':['Sagitário',9],'Netuno':['Capricórnio',10],'Plutão':['Escorpião',8],'Ascendente':['Áries',1],'Meio do Céu':['Capricórnio',10]},
  retro:['Mercúrio'],
  merc:'pensa em rede, com amigos',
  sat:'O seu está colado em Urano, o Inventor, na casa 9: estrutura e liberdade nos estudos.',
  asp:{conj:'No seu mapa: Saturno e Urano, colados.',sext:'No seu mapa: Sol e Marte.',trig:'No seu mapa: Marte e Júpiter.',quad:'No seu mapa: Vênus e Saturno.',opos:'Você não tem planetas em oposição. Uma gangorra a menos!'},
  learn:[['Veja o todo antes dos detalhes.',' Primeiro o para quê, depois o como.'],['Pedaços curtos e jogos.',' Uma ideia por vez, para o cérebro não ficar cheio.'],['Com a turma.',' Seu Mercúrio mora na casa 11: aprender em grupo rende mais.'],['Ensinar para fixar.',' Casa 9 cheia de planetas: você é professora de nascença.'],['Rever depois.',' Mercúrio retrógrado pensa duas vezes. Voltar ao assunto ajuda.'],['Convites, não ordens.',' Aquário gosta de escolher o próprio caminho.']],
  four:[['Sol',' em Aquário, casa 11: brilho original, entre amigos e grupos.'],['Mercúrio',' em Aquário, casa 11 (retrógrado), colado no Sol: você precisa entender para se sentir você.'],['Lua',' em Sagitário, casa 9: o coração quer liberdade, sentido e estudo.'],['Ascendente',' em Áries: você chega ao mundo na frente, com coragem.']],

 renata:{name:'Renata',other:'sarah',nasc:'10/04/1990, 07h24, São Paulo',
  pl:{'Sol':['Áries',12],'Lua':['Libra',6],'Mercúrio':['Touro',1],'Vênus':['Peixes',10],'Marte':['Aquário',10],'Júpiter':['Câncer',3],'Saturno':['Capricórnio',9],'Urano':['Capricórnio',9],'Netuno':['Capricórnio',9],'Plutão':['Escorpião',7],'Ascendente':['Touro',1],'Meio do Céu':['Aquário',10]},
  retro:['Plutão'],
  merc:'pensa com calma, de forma prática e firme',
  sat:'O seu está em Capricórnio, o signo que ele rege, na casa 9: estrutura e paciência nos estudos.',
  asp:{conj:'No seu mapa: Mercúrio e o Ascendente.',sext:'No seu mapa: o Ascendente e Vênus.',trig:'No seu mapa: Vênus e Júpiter, e Mercúrio e Urano.',quad:'No seu mapa: a Lua e Saturno.',opos:'No seu mapa: o Sol e a Lua.'},
  learn:[['Uma ideia por vez, com calma.',' Mercúrio em Touro aprende devagar e firme, e depois não esquece.'],['Aprender fazendo e sentindo.',' Em Touro, o corpo e os sentidos ajudam: escreva à mão, caminhe, use cores.'],['Rotina de estudo em blocos.',' A Lua na casa 6 e Saturno na 9 gostam de horário certo e meta de longo prazo.'],['Espaço para os insights.',' O trígono de Mercúrio com Urano traz ideias súbitas: deixe um caderno ou um áudio por perto.'],['Ensinar do seu jeito acolhedor.',' Júpiter em Câncer na casa 3: a palavra que cuida faz você aprender e prosperar.'],['Silêncio para pensar.',' Sol na casa 12: pausas e solitude organizam a cabeça.']],
  four:[['Sol',' em Áries, casa 12: coragem para começar, que vem do silêncio e dos bastidores.'],['Mercúrio',' em Touro, casa 1: pensa com calma e firmeza, e as ideias fazem parte de quem você é.'],['Lua',' em Libra, casa 6: o coração se organiza pela rotina, pela harmonia e pelo cuidado diário.'],['Ascendente',' em Touro: você chega ao mundo com presença estável e sensorial.']],
  curio:'Uma curiosidade: o seu Sol e a sua Lua estão em oposição, a gangorra, e Saturno aperta os dois como um cabo de guerra. É o equilíbrio que o seu mapa pede.'}
};
var CH=null,PROFILE=null,MAPA={};
var ROLE={'Sol':'o seu brilho','Lua':'o seu coração','Mercúrio':'o seu jeito de pensar e falar','Vênus':'o seu amor e o seu prazer','Marte':'a sua vontade de agir','Júpiter':'a sua sorte e a sua fé','Saturno':'a sua disciplina','Urano':'a sua liberdade','Netuno':'os seus sonhos','Plutão':'a sua transformação'};
var SSTYLE={'Áries':'de um jeito corajoso, de quem vai primeiro','Touro':'com calma, conforto e firmeza','Gêmeos':'com curiosidade e conversa','Câncer':'com cuidado e acolhimento','Leão':'com brilho e coração grande','Virgem':'com atenção aos detalhes','Libra':'buscando equilíbrio e harmonia','Escorpião':'indo fundo, com intensidade','Sagitário':'com aventura e vontade de explorar','Capricórnio':'com paciência, disciplina e foco','Aquário':'de um jeito original e livre','Peixes':'com imaginação e sensibilidade'};
var HAREA={1:'no seu corpo e na sua personalidade',2:'no dinheiro e no que é seu',3:'na comunicação e no aprendizado',4:'em casa, na família e nas raízes',5:'na criação, na brincadeira e no romance',6:'na rotina, no trabalho e na saúde',7:'nas parcerias e nas relações a dois',8:'na intimidade e nas transformações',9:'nos estudos, nas viagens e nas crenças',10:'na carreira e na vida pública',11:'entre amigos, grupos e sonhos de futuro',12:'no silêncio, nos bastidores e na espiritualidade'};
var HSHORT={1:'o seu jeito de chegar ao mundo',2:'dinheiro e valores',3:'comunicar e aprender',4:'casa e família',5:'criar e brincar',6:'rotina e trabalho',7:'parcerias',8:'intimidade e transformação',9:'estudar, ensinar e explorar',10:'carreira e vida pública',11:'amigos e grupos',12:'silêncio e espiritualidade'};
var ELEM_OF={'Áries':'Fogo','Leão':'Fogo','Sagitário':'Fogo','Touro':'Terra','Virgem':'Terra','Capricórnio':'Terra','Gêmeos':'Ar','Libra':'Ar','Aquário':'Ar','Câncer':'Água','Escorpião':'Água','Peixes':'Água'};
var RULER={'Áries':'Marte','Touro':'Vênus','Gêmeos':'Mercúrio','Câncer':'Lua','Leão':'Sol','Virgem':'Mercúrio','Libra':'Vênus','Escorpião':'Plutão','Sagitário':'Júpiter','Capricórnio':'Saturno','Aquário':'Urano','Peixes':'Netuno'};
var TEN=['Sol','Lua','Mercúrio','Vênus','Marte','Júpiter','Saturno','Urano','Netuno','Plutão'];
function listPT(a){return a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' e '+a[a.length-1]}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function inHouse(h){return TEN.filter(function(p){return MAPA[p][1]===h})}
function inSign(sg){return TEN.filter(function(p){return MAPA[p][0]===sg})}
function inElem(e){return TEN.filter(function(p){return ELEM_OF[MAPA[p][0]]===e})}
function houseNote(h){var a=inHouse(h);return a.length?' No seu mapa moram aqui: '+listPT(a)+'.':''}
function elemNote(e){var a=inElem(e);return a.length?'Você tem '+a.length+' planeta'+(a.length>1?'s':'')+' em '+e+': '+listPT(a)+'.':'Nenhum planeta seu mora aqui. É um elemento para aprender com as outras pessoas.'}
function groupNote(hs){var out=[];hs.forEach(function(h){var a=inHouse(h);if(a.length)out.push(listPT(a)+' (casa '+h+')')});return out.length?'Moram aqui: '+out.join('; ')+'.':''}
function dualNote(sg,modern){var a=inSign(sg);if(!a.length)return '';if(a.length===1&&a[0]===modern)return 'O seu '+modern+' está em casa aqui!';var o=a.filter(function(x){return x!==modern});return modern+' rege '+o.map(function(x){return 'o seu '+x}).join(' e ')+'.'}
function ex(p){var m=MAPA[p];return cap(ROLE[p])+' (<b>'+p+'</b>), '+SSTYLE[m[0]]+' (<b>'+m[0]+'</b>), '+HAREA[m[1]]+' (<b>casa '+m[1]+'</b>).'}

var P5=[
 ['Sol','o Rei do show','O que te faz sentir viva. O seu brilho.'],
 ['Lua','o Coração','Como você sente e se liga às pessoas. O seu cantinho seguro.'],

 ['Marte','o Motorzinho','O que te apaixona e te acende. A vontade de ir lá e fazer.']
];

 ['Júpiter','o Grande Sorriso','Crenças, sorte, abundância. Onde as coisas crescem.'],
 ['Saturno','o Professor rígido','Disciplina e grandes desafios. Ensina pelo esforço.'],
 ['Urano','o Inventor maluquinho','Mudança, liberdade e novidade.'],
 ['Netuno','o Sonhador','Imaginação, arte, intuição e espiritualidade.'],
 ['Plutão','o Mágico das transformações','Profundidade e renascimento.']
];
function flipP(list){return list.map(function(p){return {c:COL[p[0]],g:g(p[0]),t:p[0],s:p[1],back:p[2],em:mine(p[0])}})}

}
function parseRes(s){var p=(s||'').trim().split(/\s+/).pop().split('-');if(p.length<4)return null;return {code:p[0].toUpperCase(),score:+p[1],secs:+p[2],name:p.slice(3).join('-').replace(/_/g,' ')}}
function compare(mine,theirs,code,out){
  var a=parseRes(mine),b=parseRes(theirs);
  if(!b||isNaN(b.score)||isNaN(b.secs)){out.appendChild(el('div',{class:'why'},'Não entendi esse código. Cole o resultado inteiro que ela mandou.'));return}
  if(b.code!==code.toUpperCase()){out.appendChild(el('div',{class:'why'},'Esse resultado é de outro duelo ('+b.code+'). Joguem o mesmo código.'));return}
  var w=a.score===b.score?(a.secs===b.secs?-1:(a.secs<b.secs?0:1)):(a.score>b.score?0:1);
  var msg=w<0?'Empate total!':(w===0?a.name:b.name)+' venceu'+(a.score===b.score?' no tempo':'')+'!';
  out.appendChild(el('div',{class:'cmp',html:'<table><tr><th></th><th>Pontos</th><th>Tempo</th></tr><tr><td><b>'+a.name+'</b></td><td>'+a.score+'</td><td>'+a.secs+'s</td></tr><tr><td><b>'+b.name+'</b></td><td>'+b.score+'</td><td>'+b.secs+'s</td></tr></table><p class="win">'+msg+'</p>'}));
  if(w>=0)confetti();
}

/* --- 3. pergunta para a outra --- */
function askMenu(){
  screen('Pergunta para a outra',together);
  var c=el('div',{class:'card'});c.appendChild(el('p',{},'Quem ensina aprende duas vezes. Crie uma pergunta com o que você sabe, ou responda a que a outra mandou.'));
  c.appendChild(el('button',{class:'btn gold wide',id:'ask-new',onclick:askCreate},'Criar uma pergunta'));
  c.appendChild(el('button',{class:'btn wide',style:'margin-top:10px',id:'ask-recv',onclick:askReceive},'Responder a uma pergunta'));
  app.appendChild(c);bottom([]);
}
function askCreate(){
  screen('Criar pergunta',askMenu);
  var c=el('div',{class:'card'});
  var q=el('input',{class:'inp',placeholder:'Sua pergunta',id:'ask-q'});var o=[0,1,2].map(function(i){return el('input',{class:'inp',placeholder:'Opção '+(i+1),style:'margin-top:8px',id:'ask-o'+i})});
  var w=el('input',{class:'inp',placeholder:'Por que essa é a certa? (uma frase)',id:'ask-w'});
  var sel=el('div',{class:'chips',style:'margin:8px 0'});var ans=0;[0,1,2].forEach(function(i){var ch=el('button',{class:'chip'+(i===0?' sel':''),onclick:function(){ans=i;[].forEach.call(sel.children,function(k,j){k.classList.toggle('sel',j===i)})}},'A certa é a '+(i+1));sel.appendChild(ch)});
  c.appendChild(el('div',{class:'slot'},el('label',{},'Pergunta'),q));c.appendChild(el('div',{class:'slot'},el('label',{},'Opções'),o[0],o[1],o[2]));c.appendChild(sel);c.appendChild(el('div',{class:'slot'},el('label',{},'Explicação'),w));
  var out=el('div',{id:'ask-out'});
  c.appendChild(el('button',{class:'btn gold wide',id:'ask-make',onclick:function(){
    var obj={q:q.value.trim(),o:o.map(function(x){return x.value.trim()}),a:ans,w:w.value.trim(),n:cleanName(S.name)};
    if(!obj.q||obj.o.some(function(x){return !x})){toast('Preencha a pergunta e as 3 opções');return}
    var code='Q-'+btoa(unescape(encodeURIComponent(JSON.stringify(obj))));out.innerHTML='';
    out.appendChild(el('p',{style:'text-align:center;margin-top:12px'},'Pronto! Mande este código para a outra:'));out.appendChild(el('div',{class:'codebox',style:'font-size:12px;letter-spacing:0;word-break:break-all',id:'ask-code'},code));
    out.appendChild(el('button',{class:'btn ghost wide',style:'margin-top:8px',onclick:function(){copyText(code)}},'Copiar código'));addPts(10)
  }},'Gerar código'));c.appendChild(out);app.appendChild(c);bottom([]);
}
function parseAsk(s){try{s=(s||'').trim().split(/\s+/).pop();if(s.indexOf('Q-')!==0)return null;var o=JSON.parse(decodeURIComponent(escape(atob(s.slice(2)))));if(!o.q||!o.o||o.o.length!==3)return null;return o}catch(e){return null}}
function askReceive(){
  screen('Responder pergunta',askMenu);
  var c=el('div',{class:'card'});c.appendChild(el('p',{},'Cole aqui o código que a outra mandou.'));
  var ta=el('textarea',{class:'inp',placeholder:'Q-...',id:'ask-in'});c.appendChild(ta);
  c.appendChild(el('button',{class:'btn gold wide',style:'margin-top:10px',id:'ask-play',onclick:function(){
    var o=parseAsk(ta.value);if(!o){toast('Não entendi esse código');return}
    screen('Pergunta de '+(o.n||'uma amiga'),askMenu);
    var q={q:o.q,o:o.o,a:o.a,why:o.w||'Peça a explicação para ela!'};
    var card=choiceCard(q,qopts(q,mul(hashS(o.q))),'Pergunta de '+(o.n||'uma amiga'),function(ok){addPts(ok?10:3);if(ok)confetti()});app.appendChild(card);bottom([el('button',{class:'btn wide',onclick:askMenu},'Voltar')]);
  }},'Jogar'));app.appendChild(c);bottom([]);
}

/* ===== início, com atalhos para teste ===== */
function chooser(){
  cur=null;app.innerHTML='';bottom([]);
  app.appendChild(el('header',{class:'top'},el('div',{class:'brand'},'Missão ',el('span',{},'Astro')),el('div',{})));
  app.appendChild(el('div',{class:'hero'},el('div',{class:'stars'},'✦ ✧ ✦'),el('h1',{},'Quem está jogando?'),el('p',{},'Escolha o seu nome. O curso inteiro vai usar o seu mapa nos exemplos.')));
  var box=el('div',{class:'days'});
  ['renata','sarah'].forEach(function(k){var c=CHARTS[k];box.appendChild(el('button',{class:'day',id:'pick-'+k,onclick:function(){setProfile(k);home()}},el('div',{class:'n glyph',style:'--c:#6f3fa0'},c.name.charAt(0)),el('div',{},el('b',{},'Sou a '+c.name),el('small',{},'Entrar com o meu mapa')),el('div',{class:'st'},'›')))});
  app.appendChild(box);
  app.appendChild(el('p',{style:'text-align:center;color:#7a6a88;font-size:14px;margin-top:14px'},'O seu progresso fica só neste aparelho. Dá para trocar de pessoa a qualquer momento.'));
}
(function(){
  var h=location.hash||'';var key=null;
  if(h==='#escolher'){chooser();return}
  if(h==='#sarah'||h==='#renata')key=h.slice(1);
  else{try{key=localStorage.getItem('missaoAstroProfile')}catch(e){}}
  var dbg=/^#(d\d+s\d+|mapa|juntas)$/.test(h);
  if(!CHARTS[key]&&dbg)key='sarah';
  if(!CHARTS[key]){chooser();return}
  setProfile(key);
  var m=h.match(/#d(\d)s(\d+)/);
  if(h==='#mapa'){mapa();return}
  if(h==='#juntas'){together();return}
  if(m){cur={day:+m[1],step:+m[2]};renderStep();return}
  home();
})();
