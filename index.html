<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#4a2370">
<title>Missão Astro</title>
<style>
:root{--p:#4a2370;--p2:#6f3fa0;--p3:#b58fd6;--g:#c9a35b;--g2:#f2d58a;--bg:#f7f1fc;--ink:#2a2033;--mut:#7a6a88;--ok:#2f9e6e;--no:#d9432f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Trebuchet MS",-apple-system,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.45}
body{min-height:100vh;background:radial-gradient(circle at 50% -10%,#efe2fb 0,#f7f1fc 45%,#f7f1fc 100%)}
#app{max-width:560px;margin:0 auto;padding:14px 16px 96px}
.glyph{font-family:"Apple Symbols","Menlo","Segoe UI Symbol",serif}
header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
.brand{font-family:Georgia,serif;font-size:20px;color:var(--p);letter-spacing:.02em}
.brand span{color:var(--g)}
.pts{background:#fff;border:2px solid var(--g2);color:var(--p);font-weight:700;border-radius:99px;padding:4px 12px;font-size:15px}
h1,h2,h3{font-family:Georgia,serif;font-weight:400;color:var(--p);margin:0}
h1{font-size:30px;line-height:1.12}
h2{font-size:23px;line-height:1.2}
p{margin:6px 0}
.hero{background:linear-gradient(145deg,var(--p) 0,var(--p2) 60%,#8a58c0 100%);color:#fff;border-radius:26px;padding:22px 20px;box-shadow:0 8px 24px rgba(74,35,112,.25);position:relative;overflow:hidden}
.hero h1{color:#fff}
.hero p{color:#ecdffb}
.hero .stars{position:absolute;right:14px;top:10px;color:var(--g2);letter-spacing:6px;font-size:14px;opacity:.9}
.bar{height:10px;background:rgba(255,255,255,.22);border-radius:99px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g));border-radius:99px;transition:width .5s}
.bar-l{font-size:13px;color:#e4d3f6;margin-top:6px}
.days{display:grid;gap:12px;margin-top:18px}
.day{display:flex;gap:14px;align-items:center;background:#fff;border-radius:22px;padding:14px 14px;box-shadow:0 2px 10px rgba(74,35,112,.10);border:2px solid transparent;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;transition:transform .12s}
.day:active{transform:scale(.985)}
.day .n{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;background:var(--c,var(--p2))}
.day b{display:block;font-family:Georgia,serif;font-size:19px;color:var(--p);font-weight:400}
.day small{color:var(--mut);font-size:14px}
.day .st{margin-left:auto;font-size:22px;color:#d9cce8}
.day.done{border-color:#bfe6d3}
.day.done .st{color:var(--ok)}
.tile{background:#fff;border-radius:22px;padding:16px;margin-top:16px;box-shadow:0 2px 10px rgba(74,35,112,.10)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--p);color:#fff;border:0;border-radius:16px;padding:14px 20px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 4px 0 #2f1550;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2f1550}
.btn.gold{background:var(--g);color:#2b1c05;box-shadow:0 4px 0 #8d6d2c}
.btn.gold:active{box-shadow:0 1px 0 #8d6d2c}
.btn.ghost{background:#fff;color:var(--p);box-shadow:0 0 0 2px var(--p3) inset;border:0}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.wide{width:100%}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.link{background:none;border:0;color:var(--p2);font:inherit;text-decoration:underline;cursor:pointer;padding:6px}
/* lesson */
.lt{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.x{background:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:20px;color:var(--p);box-shadow:0 1px 6px rgba(74,35,112,.15);cursor:pointer}
.dots{flex:1;display:flex;gap:5px}
.dots i{flex:1;height:8px;border-radius:99px;background:#e2d4f0}
.dots i.on{background:var(--g)}
.dots i.cur{background:var(--p2)}
.card{background:#fff;border-radius:26px;padding:22px 20px;box-shadow:0 6px 20px rgba(74,35,112,.13);animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card .big{font-size:56px;text-align:center;margin:4px 0 8px;color:var(--c,var(--p2))}
.card h2{text-align:center;margin-bottom:8px}
.card p{font-size:18px}
.tag{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--g);font-weight:700;margin-bottom:4px}
.trio{display:grid;gap:10px;margin:12px 0}
.trio div{border-radius:16px;padding:12px 14px;background:var(--b);border-left:6px solid var(--c);font-size:17px}
.trio b{font-family:Georgia,serif;font-size:22px;color:var(--c);margin-right:6px}
.flipgrid{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:12px}
.flipgrid.one{grid-template-columns:1fr}
.fl{perspective:700px;height:150px;cursor:pointer;border:0;background:none;padding:0;font:inherit;text-align:center}
.fl .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fl.on .in{transform:rotateY(180deg)}
.fl .f,.fl .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fl .f{background:var(--c,var(--p2));color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.fl .f .g{font-size:38px;line-height:1}
.fl .f b{font-family:Georgia,serif;font-weight:400;font-size:20px;margin-top:4px}
.fl .f small{opacity:.85;font-size:13px}
.fl .b{background:var(--b,#fff);color:var(--ink);transform:rotateY(180deg);border:3px solid var(--c);font-size:15px;line-height:1.3}
.fl .b em{font-style:normal;font-weight:700;color:var(--c);display:block;margin-top:6px;font-size:14px}
.hint{text-align:center;color:var(--mut);font-size:14px;margin-top:10px}
.q{font-size:20px;font-family:Georgia,serif;color:var(--p);margin:2px 0 14px;line-height:1.3}
.opts{display:grid;gap:10px}
.opt{background:#fff;border:2px solid #e2d4f0;border-radius:16px;padding:14px 16px;font:inherit;text-align:left;cursor:pointer;color:var(--ink);transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt.ok{background:#e1f5ec;border-color:var(--ok)}
.opt.no{background:#fde7e3;border-color:var(--no);animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.why{margin-top:12px;background:#fff8e6;border-left:5px solid var(--g);border-radius:12px;padding:10px 12px;font-size:16px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{background:#fff;border:2px solid #e2d4f0;border-radius:14px;padding:12px 10px;font:inherit;font-size:15px;cursor:pointer;min-height:58px;text-align:center;color:var(--ink)}
.mi.sel{border-color:var(--p2);background:#f1e8fb}
.mi.ok{background:#e1f5ec;border-color:var(--ok);pointer-events:none;opacity:.75}
.mi.no{animation:sh .35s;border-color:var(--no)}
.mi b{font-family:Georgia,serif;font-weight:400;font-size:17px;color:var(--p)}
.slot{margin:10px 0}
.slot label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #e2d4f0;background:#fff;border-radius:99px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.chip.sel{background:var(--p2);color:#fff;border-color:var(--p2)}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.no{background:var(--no);border-color:var(--no);color:#fff}
.scn{background:#f4ecfb;border-radius:16px;padding:12px 14px;font-size:17px;margin-bottom:6px}
.mission{background:linear-gradient(145deg,#fff6df,#fff);border:3px dashed var(--g);border-radius:26px;padding:22px 20px;text-align:center}
.mission .big{font-size:48px}
.check{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:14px;font-size:18px;cursor:pointer}
.check input{width:28px;height:28px;accent-color:var(--p2)}
.mine{background:linear-gradient(145deg,#efe6f7,#fff);border-radius:26px;padding:18px;border:2px solid var(--p3)}
.mine ul{margin:8px 0 0;padding:0;list-style:none}
.mine li{padding:9px 0;border-top:1px dashed #cdb8e4;font-size:16px}
.mine li:first-child{border-top:0}
.mine b{color:var(--p)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid #e6d9f0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.nav .btn{flex:1}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:in .3s}
.conf{position:fixed;top:-20px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
.tabs{display:flex;gap:8px;margin:12px 0 4px}
.tab{flex:1;background:#fff;border:2px solid #e2d4f0;border-radius:14px;padding:10px;font:inherit;font-weight:700;color:var(--p);cursor:pointer}
.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
.mp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mp div{background:#fff;border-radius:16px;padding:10px 12px;border-left:6px solid var(--c);box-shadow:0 2px 8px rgba(74,35,112,.08);font-size:14px}
.mp b{display:block;font-family:Georgia,serif;font-weight:400;font-size:17px;color:var(--p)}
.cert{background:linear-gradient(150deg,#fff8e6,#fff);border:4px double var(--g);border-radius:26px;padding:26px 18px;text-align:center}
.cert h1{margin:6px 0}

.inp{width:100%;padding:12px 14px;border:2px solid #e2d4f0;border-radius:14px;font:inherit;background:#fff;color:var(--ink)}
textarea.inp{min-height:96px;font-size:14px;word-break:break-all}
.score{display:flex;gap:10px;margin-bottom:12px}
.score div{flex:1;border-radius:16px;padding:8px 10px;background:#fff;text-align:center;border:3px solid transparent;font-weight:700;color:var(--mut)}
.score div.on{border-color:var(--g);background:#fff8e6;color:var(--p)}
.score b{display:block;font-size:26px;color:var(--p);font-family:Georgia,serif;font-weight:400}
.codebox{background:#f4ecfb;border:2px dashed var(--p3);border-radius:14px;padding:12px;font-family:Menlo,monospace;font-size:24px;text-align:center;letter-spacing:.25em;color:var(--p);margin:8px 0}
.cmp table{width:100%;border-collapse:collapse;margin-top:14px}
.cmp th,.cmp td{border-bottom:1px solid #e2d4f0;padding:8px;text-align:center}
.cmp .win{text-align:center;font-family:Georgia,serif;font-size:22px;color:var(--p);margin:12px 0 0}
.hr{display:flex;align-items:center;gap:8px}
.langbtn{background:#fff;border:2px solid var(--p3);color:var(--p);font:inherit;font-weight:700;font-size:13px;border-radius:99px;padding:4px 10px;cursor:pointer}
.tmr{position:relative;height:22px;background:#eadff6;border-radius:99px;overflow:hidden;margin:2px 0 10px}
.tmr i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,var(--g),var(--g2));transition:width .1s linear}
.tmr span{position:relative;display:block;text-align:center;font-size:13px;font-weight:700;line-height:22px;color:var(--p)}
.tmr.hurry i{background:var(--no)}.tmr.hurry span{color:#fff}
.opt.lock{pointer-events:none}
.why.bad{background:#fde7e3;border-left-color:var(--no)}
.oth{margin-top:10px;background:#f4ecfb;border-radius:12px;padding:10px 12px;font-size:15px}
.oth ul{margin:6px 0 0;padding-left:18px}.oth li{margin:4px 0}
.bigtime{font-family:Georgia,serif;font-size:54px;color:var(--p);margin:6px 0}
.bigtime.hurry{color:var(--no)}
.sugbtn{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e2d4f0;border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;margin-bottom:8px;cursor:pointer;color:var(--ink)}
.sugbtn.sel{border-color:var(--p2);background:#f1e8fb}
.sugbtn.sel::before{content:"✓ ";color:var(--ok);font-weight:700}
</style>
</head>

    shown.forEach(function(ix){var it=BANK[ix];sugBox.appendChild(el('button',{class:'sugbtn'+(sel[ix]?' sel':''),id:'sug'+ix,onclick:function(){if(sel[ix])delete sel[ix];else sel[ix]=1;this.classList.toggle('sel');upd()}},it.q))});
    upd()}
  c.appendChild(count);c.appendChild(sugBox);
  c.appendChild(el('button',{class:'link',id:'sug-more',onclick:function(){draw(true)}},L('Ver outras sugestões','See other suggestions')));
  // pergunta própria
  var own=el('div',{style:'display:none;margin-top:8px',id:'ask-own'});
  var q=el('input',{class:'inp',placeholder:L('Sua pergunta','Your question'),id:'ask-q'});var o=[0,1,2].map(function(i){return el('input',{class:'inp',placeholder:L('Opção ','Option ')+(i+1),style:'margin-top:8px',id:'ask-o'+i})});
  var w=el('input',{class:'inp',style:'margin-top:8px',placeholder:L('Por que essa é a certa? (uma frase)','Why is that the right one? (one sentence)'),id:'ask-w'});
  var ans=0,chs=el('div',{class:'chips',style:'margin:8px 0'});[0,1,2].forEach(function(i){chs.appendChild(el('button',{class:'chip'+(i===0?' sel':''),onclick:function(){ans=i;[].forEach.call(chs.children,function(k,j){k.classList.toggle('sel',j===i)})}},L('A certa é a ','The right one is ')+(i+1)))});
  own.appendChild(q);o.forEach(function(x){own.appendChild(x)});own.appendChild(chs);own.appendChild(w);
  own.appendChild(el('button',{class:'btn ghost wide',id:'ask-add',onclick:function(){var obj={q:q.value.trim(),o:o.map(function(x){return x.value.trim()}),a:ans,w:w.value.trim()};if(!obj.q||obj.o.some(function(x){return !x})){toast(L('Preencha a pergunta e as 3 opções','Fill in the question and the 3 options'));return}customs.push(obj);q.value='';o.forEach(function(x){x.value=''});w.value='';own.style.display='none';draw(false)}},L('Adicionar à lista','Add to the list')));
  c.appendChild(el('div',{style:'margin-top:6px'},el('button',{class:'link',id:'ask-own-btn',onclick:function(){own.style.display=own.style.display==='none'?'block':'none'}},L('✎ Escrever uma pergunta minha','✎ Write my own question'))));
  c.appendChild(own);
  var out=el('div',{id:'ask-out'});

    var code='QS-'+btoa(unescape(encodeURIComponent(JSON.stringify(obj))));out.innerHTML='';
    out.appendChild(el('p',{style:'text-align:center;margin-top:12px'},L('Pronto! '+total()+' perguntas. Mande este código para a outra:',"Done! "+total()+' questions. Send this code to the other:')));out.appendChild(el('div',{class:'codebox',style:'font-size:12px;letter-spacing:0;word-break:break-all',id:'ask-code'},code));

  }},L('Gerar código com as perguntas','Generate the code with the questions')));

function parseAsk(s){try{s=(s||'').trim().split(/\s+/).pop();var pack=s.indexOf('QS-')===0;if(!pack&&s.indexOf('Q-')!==0)return null;var o=JSON.parse(decodeURIComponent(escape(atob(s.slice(pack?3:2)))));
  if(pack){var items=[];(o.b||[]).forEach(function(i){if(BANK[i])items.push(BANK[i])});(o.c||[]).forEach(function(x){if(x.q&&x.o&&x.o.length===3)items.push({q:x.q,o:x.o,a:x.a,why:x.w||L('Peça a explicação para ela!','Ask her for the explanation!')})});return items.length?{n:o.n,items:items}:null}
  if(!o.q||!o.o||o.o.length!==3)return null;return {n:o.n,items:[{q:o.q,o:o.o,a:o.a,why:o.w||L('Peça a explicação para ela!','Ask her for the explanation!')}]}}catch(e){return null}}
function askReceive(){
  screen(L('Responder perguntas','Answer questions'),askMenu);
  var c=el('div',{class:'card'});c.appendChild(el('p',{},L('Cole aqui o código que a outra mandou.','Paste the code the other sent here.')));
  var ta=el('textarea',{class:'inp',placeholder:'QS-...',id:'ask-in'});c.appendChild(ta);
  c.appendChild(el('button',{class:'btn gold wide',style:'margin-top:10px',id:'ask-play',onclick:function(){
    var o=parseAsk(ta.value);if(!o){toast(L('Não entendi esse código','I did not understand that code'));return}
    var who=o.n||L('uma amiga','a friend'),items=o.items,i=0,okc=0;
    function show(){
      if(i>=items.length)return fin();
      screen(L('Perguntas de ','Questions from ')+who,askMenu);app.appendChild(el('div',{style:'margin-bottom:10px'},dotsBar(items.length,i)));
      var q=items[i];
      var card=choiceCard(q,qopts(q,mul(hashS(q.q+i))),L('Pergunta ','Question ')+(i+1)+'/'+items.length+' · '+who,function(ok){addPts(ok?10:3);if(ok){okc++;confetti()}nx.removeAttribute('disabled')});
      app.appendChild(card);
      var nx=el('button',{class:'btn wide',disabled:'',id:'ask-next',onclick:function(){i++;show()}},i===items.length-1?L('Ver o resultado','See the result'):L('Próxima','Next'));bottom([nx]);window.scrollTo(0,0)}
    function fin(){app.innerHTML='';app.appendChild(topbar());confetti();app.appendChild(el('div',{class:'cert'},el('div',{class:'tag'},L('Perguntas respondidas','Questions answered')),el('h1',{},L('Você acertou '+okc+' de '+items.length,'You got '+okc+' of '+items.length)),el('p',{},L('Agora é a sua vez de desafiar '+who+'.','Now it is your turn to challenge '+who+'.'))));bottom([el('button',{class:'btn ghost',onclick:together},L('Outros jogos','Other games')),el('button',{class:'btn gold',id:'ask-back',onclick:askCreate},L('Mandar as minhas','Send mine'))])}
    show();
  }},L('Jogar','Play')));app.appendChild(c);bottom([]);
}

/* ===== convidar e criar o próprio mapa ===== */
function invite(){
  var url=location.href.split('#')[0]+'#criar'+(LANG==='en'?'-en':'');
  var msg=L('Venha aprender astrologia comigo! Crie o seu mapa em 1 minuto e jogue: ','Come learn astrology with me! Create your chart in 1 minute and play: ')+url;
  if(navigator.share){navigator.share({title:L('Missão Astro','Astro Mission'),text:L('Venha aprender astrologia comigo!','Come learn astrology with me!'),url:url}).catch(function(){})}
  else copyText(msg)}
function delMap(){
  if(!confirm(L('Apagar o seu mapa e o seu progresso deste aparelho?','Delete your chart and progress from this device?')))return;
  var id=PROFILE;saveGuests(loadGuests().filter(function(x){return x.id!==id}));try{localStorage.removeItem('missaoAstro_'+id);localStorage.removeItem('missaoAstroProfile')}catch(e){}
  PROFILE=null;CH=null;setLang(LANG);chooser()}
function geocode(name,cb,err){
  var url='https://geocoding-api.open-meteo.com/v1/search?count=6&format=json&language='+(LANG==='en'?'en':'pt')+'&name='+encodeURIComponent(name);
  fetch(url).then(function(r){return r.json()}).then(function(j){cb((j.results||[]).map(function(x){return {label:x.name+(x.admin1?', '+x.admin1:'')+(x.country?', '+x.country:''),short:x.name,lat:x.latitude,lon:x.longitude,tz:x.timezone}}))}).catch(function(){err()})}
function createMap(){
  LANGBACK=createMap;cur=null;app.innerHTML='';bottom([]);
  app.appendChild(el('header',{class:'top'},BRAND(),el('div',{class:'hr'},el('button',{class:'langbtn',id:'lang-toggle',onclick:toggleLang},LANG==='pt'?'🌐 English':'🌐 Português'))));
  app.appendChild(el('div',{class:'hero'},el('div',{class:'stars'},'✦ ✧ ✦'),el('h1',{},L('Crie o seu mapa','Create your chart')),el('p',{},L('Em um minuto o curso e os jogos ficam com o seu mapa. Os seus dados de nascimento ficam só neste aparelho.','In one minute the course and games use your chart. Your birth data stays only on this device.'))));
  var c=el('div',{class:'card',style:'margin-top:14px'}),place=null,found=[];
  function inp(id,ph,ml,w){return el('input',{class:'inp',id:id,placeholder:ph,maxlength:ml,inputmode:'numeric',style:'width:'+w+';text-align:center'})}
  var nm=el('input',{class:'inp',id:'cm-name',placeholder:L('Seu nome','Your name'),maxlength:12});
  var dd=inp('cm-d',L('dia','day'),2,'30%'),mm=inp('cm-m',L('mês','month'),2,'30%'),yy=inp('cm-y',L('ano','year'),4,'36%');
  var hh=inp('cm-hh',L('hora','hour'),2,'30%'),mi=inp('cm-mi',L('min','min'),2,'30%');
  var ntc=el('input',{type:'checkbox',id:'cm-nt'}),nt=el('label',{class:'check',style:'justify-content:flex-start;font-size:15px;margin-top:8px'},ntc,L('Não sei a hora de nascimento','I do not know my birth time'));
  ntc.addEventListener('change',function(){hh.disabled=mi.disabled=ntc.checked;timeRow.style.opacity=ntc.checked?.4:1});
  var city=el('input',{class:'inp',id:'cm-city',placeholder:L('Cidade onde nasceu','City where you were born')});
  var res=el('div',{id:'cm-res',style:'margin-top:8px'});var chosen=el('div',{class:'why',id:'cm-chosen',style:'display:none'});
  var find=el('button',{class:'btn ghost wide',id:'cm-find',style:'margin-top:8px',onclick:function(){
    var v=city.value.trim();if(v.length<2){toast(L('Digite o nome da cidade','Type the city name'));return}
    res.innerHTML=L('Buscando...','Searching...');
    geocode(v,function(list){res.innerHTML='';if(!list.length){res.textContent=L('Não achei essa cidade. Tente só o nome, sem estado.','I could not find that city. Try only the name, without the state.');return}
      list.forEach(function(p,ix){res.appendChild(el('button',{class:'sugbtn',id:'cm-p'+ix,onclick:function(){place=p;res.innerHTML='';chosen.style.display='block';chosen.innerHTML='📍 <b>'+p.label+'</b>'}},p.label))})},
      function(){res.textContent=L('Não consegui buscar a cidade. Confira a internet e tente de novo.','I could not search the city. Check your internet and try again.')})}},L('Buscar cidade','Search city'));
  c.appendChild(el('div',{class:'slot'},el('label',{},L('Nome','Name')),nm));
  c.appendChild(el('div',{class:'slot'},el('label',{},L('Data de nascimento','Date of birth')),el('div',{class:'row'},dd,mm,yy)));
  var timeRow=el('div',{class:'row'},hh,mi);
  c.appendChild(el('div',{class:'slot'},el('label',{},L('Hora de nascimento (24h)','Birth time (24h)')),timeRow,nt));
  c.appendChild(el('div',{class:'slot'},el('label',{},L('Cidade','City')),city,find,res,chosen));
  c.appendChild(el('button',{class:'btn gold wide',style:'margin-top:12px',id:'cm-go',onclick:function(){
    var d=+dd.value,mo=+mm.value,y=+yy.value,h=+hh.value,m=+mi.value,noT=ntc.checked;
    if(!nm.value.trim()){toast(L('Digite o seu nome','Type your name'));return}
    if(!(d>=1&&d<=31&&mo>=1&&mo<=12&&y>=1925&&y<=2015)){toast(L('Confira a data (vale de 1925 a 2015)','Check the date (1925 to 2015 works)'));return}
    if(!noT&&!(hh.value!==''&&mi.value!==''&&h>=0&&h<=23&&m>=0&&m<=59)){toast(L('Confira a hora, ou marque que não sabe','Check the time, or tick that you do not know it'));return}
    if(!place){toast(L('Busque e escolha a cidade','Search and pick the city'));return}
    var r;try{r=computeChart({y:y,mo:mo,d:d,hh:h,mm:m,tz:place.tz,lat:place.lat,lon:place.lon,noTime:noT})}catch(e){toast(L('Não consegui calcular esse mapa','I could not work out this chart'));return}
    var id='g_'+Date.now().toString(36),gx={id:id,name:cleanName(nm.value),birth:{d:d,mo:mo,y:y,hh:h,mm:m,place:place.short},pl:r.pl,lons:r.lons,retro:r.retro,noTime:noT,moonAlt:r.moonAlt||null};
    var gs=loadGuests();gs.push(gx);saveGuests(gs);PROFILE=null;setLang(LANG);setProfile(id);home();confetti()
  }},L('Criar o meu mapa e começar','Create my chart and start')));
  c.appendChild(el('p',{style:'text-align:center;margin-top:10px'},el('button',{class:'link',id:'cm-back',onclick:chooser},L('Voltar','Back'))));
  app.appendChild(c);
}
